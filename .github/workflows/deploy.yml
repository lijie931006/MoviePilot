name: Build and Deploy

on:
  push:
    branches: [ "my" ] # 只在推送到 main 分支时触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Get APP_VERSION from version.py
      run: |
        echo "APP_VERSION=$(python -c 'from version import APP_VERSION; print(APP_VERSION)')" >> $GITHUB_ENV

    - name: Build and Push Docker image
      run: |
        docker build -f docker/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/moviepilot-v2:${{ env.APP_VERSION }} .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/moviepilot-v2:${{ env.APP_VERSION }}

