name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 时间 00:00 (北京时间早上8点) 运行一次
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Fork
        uses: tgymnich/fork-sync@v1.8
        with:
          owner: jxxghp/MoviePilot
          base: v2
          head: v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
